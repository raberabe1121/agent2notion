openapi: 3.1.1
info:
  title: Agent2Notion API
  version: 1.0.0

servers:
  - url: https://agent2notion-api.iksolaris17.workers.dev

paths:
  /parse:
    post:
      summary: Parse raw product data
      operationId: parse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
      responses:
        "200":
          description: Parsed data

  /notion/import:
    post:
      summary: Import product data into Notion
      operationId: import_to_notion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                records:
                  type: array
                  items:
                    type: object
                    properties:
                      product:
                        type: string
                      price:
                        type: number
                      rating:
                        type: number
                      timestamp:
                        type: string
                        format: date-time
                  required:
                    - product
                    - price
                    - rating
                    - timestamp
      responses:
        "200":
          description: Imported
