openapi: 3.0.1
info:
  title: Agent2Notion API
  version: "1.0.0"
servers:
  - url: https://agent2notion.pages.dev
paths:
  /parse:
    post:
      summary: Parse Agent JSON
      operationId: parse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
      responses:
        '200':
          description: Parsed structured data
  /notion/import:
    post:
      summary: Import structured data into Notion
      operationId: import_to_notion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                records:
                  type: array
                  items:
                    type: object
                    properties:
                      product:
                        type: string
                      price:
                        type: number
                      rating:
                        type: number
                      timestamp:
                        type: string
                        format: date-time
                    required:
                      - product
                      - price
                      - rating
                      - timestamp
                    example:
                      product: "Sony WH-1000XM5"
                      price: 49500
                      rating: 4.7
                      timestamp: "2025-11-12T10:00:00Z"
      responses:
        '200':
          description: Successful import
